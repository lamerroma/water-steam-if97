name: Release acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium firefox
      - name: Install independent spreadsheet readers
        run: python -m pip install -r scripts/reference/requirements-p08.txt
      - name: Independent inverse reference smoke audit
        run: npm run audit:inverse:quick
      - run: npm run verify:release
      - name: Summarize acceptance and model limits
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          reports = []
          for path in Path('.release').glob('*/report.json'):
              try:
                  candidate = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              if isinstance(candidate, dict) and all(key in candidate for key in ('started', 'mode', 'status', 'version', 'checks')) and candidate['mode'] in ('core', 'browser', 'full'):
                  reports.append(candidate)
          if reports:
              report = max(reports, key=lambda item: item['started'])
              build = report.get('build') or {}
              lines = [f"## Software acceptance: {report['status']}", f"Version: {report['version']} · build: {build.get('id', 'unknown')}"]
              lines += [f"- {check['name']}: {check['status']}" for check in report['checks']]
              physical = report.get('physicalValidation', {}).get('reactorCell', 'not evaluated')
              lines += ['', f"**Reactor cell physical validation: {physical}.**", 'Passing software checks does not validate the neutron model. It remains experimental until external benchmarks agree.']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('\n'.join(lines) + '\n')
          PYTHON
      - name: Check committed build is current
        run: git diff --exit-code -- index.html assets dist service-worker.js manifest.webmanifest
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance
          path: .release/
          include-hidden-files: true
          retention-days: 14

  inverse-full:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent spreadsheet readers
        run: python -m pip install -r scripts/reference/requirements-p08.txt
      - name: Full independent inverse reference audit before publication
        run: npm run audit:inverse:full
      - name: Steam97 P02 critical pressure grid and P01 replay
        run: npm run audit:steam97:p02
      - name: Steam97 P05 independent domains and transport audit
        run: npm run audit:steam97:p05
      - name: Steam97 P06 independent turbine and flash audit
        run: npm run audit:steam97:p06
      - name: Steam97 P07 independent diagram and drawing audit
        run: npm run audit:steam97:p07
      - name: Steam97 P08 independent spreadsheet reader audit
        run: npm run audit:steam97:p08
      - name: Preserve all roots and reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverse-full-reference-audit
          path: |
            .release/inverse-precision/
            .release/steam97-p02/
            .release/steam97-p05/
            .release/steam97-p06/
            .release/steam97-p07/
            .release/steam97-p08/
          include-hidden-files: true
          retention-days: 14
