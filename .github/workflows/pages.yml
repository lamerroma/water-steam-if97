name: Publish GitHub Pages
# Auto-deploys on every push to main once Settings -> Pages -> Source is set to
# "GitHub Actions" (a one-time, separate decision -- see README). Also runnable
# manually from the Actions tab (workflow_dispatch) to force a redeploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful full CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 90; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', branch: 'main',
                event: 'push', head_sha: context.sha, per_page: 20
              });
              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === context.sha && run.head_branch === 'main' && run.event === 'push'
              );
              const accepted = runs.find(run => run.status === 'completed' && run.conclusion === 'success');
              if (accepted) {
                await core.summary.addHeading('Full release acceptance passed')
                  .addLink('CI evidence for the deployed commit', accepted.html_url).write();
                return;
              }
              if (runs.length && runs.every(run => run.status === 'completed')) {
                throw new Error('Full CI did not pass for this commit; deployment is blocked.');
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for full CI; deployment is blocked.');
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
